name: CI

# M1 core (DESIGN v3.2 §12.1, §12.2): lint + unit tests, then an amd64 build loaded into the
# runner's own Docker (never pushed, no build cache, no artifact) and the container smoke test.
on:
  push:
    branches: [feat/m1-core]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    name: lint + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (Node 24)
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version | head -n 2
          shellcheck -s sh \
            litellm/rootfs/usr/local/lib/woow-litellm/common.sh \
            litellm/rootfs/usr/local/lib/woow-litellm/woow-init \
            litellm/rootfs/usr/local/lib/woow-litellm/svc-finish \
            litellm/rootfs/usr/local/lib/woow-litellm/init-postgres \
            litellm/rootfs/usr/local/lib/woow-litellm/init-db \
            litellm/rootfs/usr/local/lib/woow-litellm/litellm-predump \
            litellm/rootfs/usr/local/lib/woow-litellm/litellm-migrate \
            litellm/rootfs/usr/local/lib/woow-litellm/woow-revoke-ui-sessions \
            litellm/rootfs/usr/local/lib/woow-litellm/woow-spendlogs-indexes \
            litellm/rootfs/usr/local/bin/woow-healthcheck \
            litellm/rootfs/etc/s6-overlay/s6-rc.d/*/run \
            litellm/rootfs/etc/s6-overlay/s6-rc.d/*/finish \
            litellm/rootfs/etc/s6-overlay/s6-rc.d/*/data/check \
            tools/*.sh
          shellcheck -s bash tests/smoke/run-smoke.sh
      - name: python tools
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pytest==8.3.4 pyyaml==6.0.2 apscheduler==3.11.2 yamllint==1.35.1
      - name: yamllint
        run: |
          /tmp/venv/bin/yamllint -d '{extends: relaxed, rules: {line-length: {max: 160}}}' \
            litellm/config.yaml litellm/translations .github/workflows
      - name: Woow plugin copy equals its lock
        run: tools/verify-woow-plugin.sh --offline
      - name: unit tests
        run: /tmp/venv/bin/pytest -q tests

  build-smoke:
    name: build amd64 + assembly checks + container smoke
    needs: lint-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LOCK: litellm/upstream.lock.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (Node 24)
        with:
          persist-credentials: false
      - name: BuildKit v0.33.0 builder (docker-container driver; same as the SP1/SP4 spike)
        run: |
          docker buildx create --name woow --driver docker-container \
            --driver-opt image=moby/buildkit:v0.33.0 --bootstrap --use
          docker buildx inspect --bootstrap | sed -n '1,12p'
      - name: pinned upstream (amd64) into an OCI layout on the runner, facts vs lock
        run: |
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/private"
          python3 -I tools/checks/fetch_upstream.py \
            --repo "$(jq -r .image "$LOCK")" --index-digest "$(jq -r .index_digest "$LOCK")" \
            --manifest-digest "$(jq -r '.platforms["linux/amd64"].manifest_digest' "$LOCK")" \
            --out "$RUNNER_TEMP/upstream"
          python3 -I tools/checks/upstream_facts.py "$RUNNER_TEMP/upstream" --lock "$LOCK" \
            --out "$RUNNER_TEMP/reports" --private "$RUNNER_TEMP/private"
      - name: build (image tar on the runner only; nothing pushed, no cache)
        run: |
          version="$(sed -n 's/^version: *//p' litellm/config.yaml)"
          export SOURCE_DATE_EPOCH="$(jq -r .source_date_epoch "$LOCK")"
          start=$(date +%s)
          docker buildx build --platform linux/amd64 --pull --no-cache --provenance=false --sbom=false \
            --build-arg BUILD_VERSION="$version" --build-arg BUILD_REF="${GITHUB_SHA}" --build-arg BUILD_ARCH=amd64 \
            --output "type=docker,dest=$RUNNER_TEMP/final.image.tar,name=woow-litellm:ci,rewrite-timestamp=true,compression=gzip,compatibility-version=30" \
            litellm
          echo "build took $(( $(date +%s) - start ))s"
          ls -l "$RUNNER_TEMP/final.image.tar"
      - name: "assembly checks (DESIGN §5.1 #1, #9, #10; SP1 scripts): enterprise content, Env, per-layer scan"
        run: |
          python3 -I tools/checks/image_report.py "$RUNNER_TEMP/final.image.tar" --out "$RUNNER_TEMP/reports" \
            --name final --epoch "$(jq -r .source_date_epoch "$LOCK")"
          python3 -I - "$RUNNER_TEMP/reports/final.json" "$LOCK" <<'PY'
          import json, sys
          rep, lock = json.load(open(sys.argv[1])), json.load(open(sys.argv[2]))
          for l in rep["layers"]:
              print(f"layer {l['index']}: {l['digest']} {l['size']/2**20:.1f} MiB gz / {l['uncompressed_size']/2**20:.1f} MiB")
          want = lock["expected_flattened_layer"]
          got = rep["layers"][0]
          print("flattened upstream layer", "UNCHANGED" if got["digest"] == want["digest"] else "CHANGED", got["digest"])
          PY
          python3 -I tools/checks/enterprise_content.py "$RUNNER_TEMP/final.image.tar" \
            --hashes "$RUNNER_TEMP/private/enterprise-hashes.txt" --summary "$RUNNER_TEMP/reports/check-1.json"
          python3 -I tools/checks/env_compare.py "$RUNNER_TEMP/final.image.tar" --lock "$LOCK" \
            --upstream-config-facts "$RUNNER_TEMP/reports/upstream-facts.json" --summary "$RUNNER_TEMP/reports/check-9.json"
          # base (flattened upstream) + apk + s6-overlay + WORKDIR (empty) + rootfs
          python3 -I tools/checks/layer_scan.py "$RUNNER_TEMP/final.image.tar" --lock "$LOCK" \
            --hashes "$RUNNER_TEMP/private/enterprise-hashes.txt" --expect-layers 5 --summary "$RUNNER_TEMP/reports/check-10.json"
      - name: load the checked image (the same tar) into the runner's Docker
        run: |
          # BuildKit's docker exporter writes an OCI layout (index.json, read by tools/checks) plus the
          # manifest.json that `docker load` needs; the classic image store cannot load an
          # oci-mediatypes OCI tar ("blobs/json: no such file").
          docker load -i "$RUNNER_TEMP/final.image.tar"
          docker image inspect -f 'id={{.Id}} size={{.Size}} layers={{len .RootFS.Layers}}' woow-litellm:ci
      - name: "check 2: unguarded enterprise imports (AST, in the image's Python 3.13)"
        run: |
          docker run --rm --network none --user 65534 -v "$GITHUB_WORKSPACE:/repo:ro" \
            --entrypoint /app/.venv/bin/python woow-litellm:ci -I /repo/tools/checks/enterprise_imports.py check \
            --root site-packages=/app/.venv/lib/python3.13/site-packages --root app=/app --exclude /app/.venv \
            --fixture /repo/tests/fixtures/enterprise-unguarded.txt
      - name: image facts
        run: |
          docker run --rm --entrypoint sh woow-litellm:ci -c '
            set -e
            cat /etc/apk/repositories; ls /etc/apk/keys
            test ! -e /app/enterprise && test ! -e /usr/local/bin/pgbouncer && test ! -e /etc/apko.json && test ! -e /var/lib/db/sbom
            ! ls -d /app/.venv/lib/python3.13/site-packages/litellm_enterprise* 2>/dev/null
            postgres --version; nginx -v; curl --version | head -n1; jq --version
            id postgres; id woow-nginx; id nobody
            apk info -v 2>/dev/null | sort > /tmp/apk.txt; wc -l < /tmp/apk.txt'
          docker image inspect -f '{{json .Config.Labels}}' woow-litellm:ci | python3 -m json.tool
          python3 - <<'PY'
          import json, subprocess
          lock = json.load(open("litellm/upstream.lock.json"))
          out = subprocess.run(["docker", "run", "--rm", "--entrypoint", "apk", "woow-litellm:ci", "info", "-v"],
                               capture_output=True, text=True, check=True).stdout.split()
          missing = [f"{p['name']}-{p['version']}" for p in lock["wolfi_apk"]["apk_add"] if f"{p['name']}-{p['version']}" not in out]
          print(f"{len(out)} apk packages installed; pinned closure missing: {missing or 'none'}")
          assert not missing
          labels = json.loads(subprocess.run(["docker", "image", "inspect", "-f", "{{json .Config.Labels}}", "woow-litellm:ci"],
                                             capture_output=True, text=True, check=True).stdout)
          assert labels["org.opencontainers.image.vendor"] == "WOOWTECH"
          assert not [k for k, v in labels.items() if "chainguard" in (k + v).lower()], labels
          PY
      - name: playwright (headless Chromium for the browser check)
        run: |
          python3 -m venv /tmp/pw
          /tmp/pw/bin/pip install --quiet playwright==1.52.0
          /tmp/pw/bin/python -m playwright install --with-deps chromium > /tmp/pw-install.log 2>&1 || { tail -n 50 /tmp/pw-install.log; exit 1; }
      - name: container smoke (a)–(d)
        env:
          PW_PYTHON: /tmp/pw/bin/python
        run: tests/smoke/run-smoke.sh woow-litellm:ci
