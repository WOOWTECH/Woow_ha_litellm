name: Temporary read-only LiteLLM pull credential
on:
  workflow_dispatch:
    inputs:
      public_key_pem:
        description: Parent's one-use RSA4096 public key; NEVER a private key
        type: string
        required: true
permissions:
  packages: read
concurrency:
  group: temporary-litellm-pull-credential
  cancel-in-progress: false
jobs:
  credential:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify exact private image metadata and seal read-only credential
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_PUBLIC_KEY: ${{ inputs.public_key_pem }}
          HANDOFF_USERNAME: ${{ github.actor }}
        run: |
          set -eu
          umask 077
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess, urllib.request, urllib.parse
          from pathlib import Path
          expected = 'sha256:444910c26d0a86d0d3d30ae7a8c3ec1d87b0a0e3b27906fbef5c0d09d4e8d36e'
          repository = 'woowtech/woow-ha-litellm-amd64'
          root = Path(os.environ['RUNNER_TEMP']) / 'readonly-handoff'
          root.mkdir(mode=0o700)
          public = Path(os.environ['RUNNER_TEMP']) / 'one-use-pull-public.pem'
          public.write_text(os.environ['HANDOFF_PUBLIC_KEY'])
          key = subprocess.run(
              ['openssl','pkey','-pubin','-in',str(public),'-text','-noout'],
              capture_output=True,check=True).stdout
          if not re.search(rb'Public-Key: \(4096 bit\)',key):
              raise SystemExit('Public key must be RSA4096')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener = urllib.request.build_opener(NoRedirect())
          token = os.environ['GH_TOKEN']
          credential = base64.b64encode((os.environ['HANDOFF_USERNAME']+':'+token).encode()).decode()
          endpoint = 'https://ghcr.io/token?'+urllib.parse.urlencode({'service':'ghcr.io','scope':'repository:'+repository+':pull'})
          try:
              request = urllib.request.Request(endpoint,headers={'Authorization':'Basic '+credential})
              with opener.open(request,timeout=20) as response:
                  value=json.load(response)
              bearer = value.get('token') or value.get('access_token')
              request = urllib.request.Request(
                  'https://ghcr.io/v2/'+repository+'/manifests/0.1.5',method='HEAD',
                  headers={'Authorization':'Bearer '+bearer,
                           'Accept':('application/vnd.oci.image.manifest.v1+json, '
                                     'application/vnd.docker.distribution.manifest.v2+json')})
              with opener.open(request,timeout=20) as response:
                  if response.headers.get('Docker-Content-Digest') != expected:
                      raise RuntimeError('digest_mismatch')
          except Exception:
              raise SystemExit('Read-only exact-digest metadata gate failed; credential not delivered') from None
          if len(token.encode()) > 446:
              raise SystemExit('Credential exceeds RSA4096 OAEP/SHA256 plaintext limit')
          encrypted=subprocess.run(
              ['openssl','pkeyutl','-encrypt','-pubin','-inkey',str(public),
               '-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256',
               '-pkeyopt','rsa_mgf1_md:sha256'],input=token.encode(),capture_output=True)
          if encrypted.returncode:
              raise SystemExit('Credential sealing failed')
          (root/'credential.enc').write_bytes(encrypted.stdout)
          meta={
              'run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_source': os.environ['GITHUB_SHA'],
              'username': os.environ['HANDOFF_USERNAME'],
              'registry': 'ghcr.io',
              'image': 'ghcr.io/' + repository + ':0.1.5',
              'expected_manifest_digest': expected,
              'release_source': '0e9997764508b75dcd38af13f8b03cd555520394',
              'public_key_sha256': hashlib.sha256(public.read_bytes()).hexdigest(),
              'permission': 'packages:read; all other configurable token permissions omitted/none',
              'expires': 'when this job completes or is cancelled',
              'hold_seconds': 1200,
              'exact_manifest_read_verified': True,
          }
          (root/'metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          print('Read-only exact-image metadata verified; encrypted handoff prepared. No token printed.')
          PY
      - name: Upload encrypted credential only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readonly-pull-handoff-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/readonly-handoff/credential.enc
            ${{ runner.temp }}/readonly-handoff/metadata.json
          if-no-files-found: error
          retention-days: 1
      - name: Bounded installation window; parent removes registry entry before ending job
        run: sleep 1200
