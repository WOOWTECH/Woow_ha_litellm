# Woow LiteLLM add-on: nginx on the Ingress port 8099 only (DESIGN §8.2, §8.3).
# Workers run as woow-nginx (uid 101): never the LiteLLM uid 65534, whose 0600 files they must not read.
user woow-nginx woow-nginx;
worker_processes 1;
pid /run/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /run/nginx/client_body;
    proxy_temp_path /run/nginx/proxy;
    fastcgi_temp_path /run/nginx/fastcgi;
    uwsgi_temp_path /run/nginx/uwsgi;
    scgi_temp_path /run/nginx/scgi;

    # Written at every start by init-woow-supervisor: the LiteLLM UI behind the Ingress prefix
    # (nginx/ingress.conf.tmpl) or, when no ingress_entry was obtained, the help page (help.conf.tmpl).
    include /run/woow/nginx/site.conf;
}
